services:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Express Backend Web Service
  # ────────────────────────────────────────────────────────────────────────────
  - type: web
    name: jansahayak-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: FRONTEND_URL
        value: https://jansahayak-rho.vercel.app
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: jansahayak-ml-service
          property: host
      - key: KEEP_ALIVE_URL
        sync: false

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Python MobileNetV2 ML Microservice (Render Free Tier 512MB RAM Optimized)
  # ────────────────────────────────────────────────────────────────────────────
  - type: web
    name: jansahayak-ml-service
    runtime: python
    plan: free
    region: oregon
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 120 --max-requests 50 --max-requests-jitter 10
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 5001
